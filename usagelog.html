<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage Log PDF Generator</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#1c2330; --muted:#667085; --line:#d8dce3;
    --accent:#1f6feb; --accent-d:#1858bd; --err:#c62828; --ok:#1b7f3b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171c; --card:#1d2128; --text:#e8ebf0; --muted:#9aa4b2; --line:#343a46; --accent:#4c8dff; --accent-d:#3b78e6; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  .card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
  label{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}
  input[type=text],input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
       background:transparent;color:inherit;font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;cursor:pointer;color:var(--muted)}
  .drop.over{border-color:var(--accent);color:var(--accent)}
  .drop strong{color:var(--text)}
  .row{display:flex;gap:10px;align-items:center}
  .row span{color:var(--muted)}
  button{margin-top:24px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent);
         color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
  button:hover{background:var(--accent-d)}
  button:disabled{opacity:.6;cursor:wait}
  .preview{margin-top:14px;font-size:13px;color:var(--muted);word-break:break-word}
  .msg{margin-top:14px;font-size:14px;min-height:20px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .note{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <h1>Usage Log PDF Generator</h1>
  <p class="sub">Upload an Excel file and get back a formatted PDF. Everything runs in your browser.</p>

  <form id="form">
    <label>Excel file</label>
    <div class="drop" id="drop">
      <input type="file" id="file" accept=".xlsx,.xlsm" hidden>
      <span id="dropText"><strong>Click to choose</strong> or drag a file here (.xlsx)</span>
    </div>

    <label for="reason">Reason</label>
    <input type="text" id="reason" placeholder="e.g. Audit" required>

    <label>Period</label>
    <div class="row">
      <input type="date" id="start" required>
      <span>to</span>
      <input type="date" id="end" required>
    </div>

    <div class="preview" id="preview"></div>
    <button type="submit" id="btn">Generate PDF</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
  <div class="note">Your file is processed on this device and never uploaded.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------ UI */
const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.add('over');}));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.remove('over');}));
drop.addEventListener('drop', ev => { if (ev.dataTransfer.files.length) { fileInput.files = ev.dataTransfer.files; showFile(); } });
fileInput.addEventListener('change', showFile);
function showFile(){
  const f = fileInput.files[0];
  $('dropText').textContent = '';
  const s = document.createElement('strong');
  s.textContent = f ? f.name : 'Click to choose';
  $('dropText').append(s, f ? '' : ' or drag a file here (.xlsx)');
}
const mdy = iso => { const [y,m,d] = iso.split('-'); return `${m}-${d}-${y}`; };
const safeName = t => t.replace(/[\\/:*?"<>|\r\n]+/g, ' ').trim();
function buildName(){
  const r = $('reason').value.trim(), s = $('start').value, e = $('end').value;
  if (!r || !s || !e) return '';
  return safeName(`Usage log request - ${r} - ${mdy(s)} to ${mdy(e)}`) + '.pdf';
}
function updatePreview(){ const n = buildName(); $('preview').textContent = n ? 'File name: ' + n : ''; }
['reason','start','end'].forEach(id => $(id).addEventListener('input', updatePreview));

/* ------------------------------------------------------- Excel helpers */
const BASE_FONT = 9, PAD = 3, MAX_COL_PT = 260;
const FIT_COLS = 8;               // columns A-H get autofit + centered

const colToNum = s => [...s].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);
const pad2 = n => String(n).padStart(2, '0');

function argbToRgb(argb){
  if (!argb || argb.length < 6) return null;
  const h = argb.slice(-6);
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}

function fmtNumber(v, fmt){
  if (!fmt || fmt === 'General') return String(Math.round(v * 1e10) / 1e10);
  const sec = fmt.split(';')[0].replace(/\[[^\]]*\]/g, '').replace(/"/g, '').replace(/\\/g, '');
  const pct = sec.includes('%');
  if (pct) v *= 100;
  const m = sec.match(/\.([0#]+)/);
  const dec = m ? m[1].length : 0;
  let s = Math.abs(v).toFixed(dec);
  if (sec.includes(',')) {
    const [i, d] = s.split('.');
    s = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d ? '.' + d : '');
  }
  if (sec.includes('$')) s = '$' + s;
  if (v < 0) s = '-' + s;
  return pct ? s + '%' : s;
}

function fmtDate(d, fmt){
  const f = (fmt || '').toLowerCase().replace(/\[[^\]]*\]/g, '');
  const hasDate = /[dy]/.test(f) || !f;
  const hasTime = /h/.test(f) || (!f && (d.getUTCHours() || d.getUTCMinutes() || d.getUTCSeconds()));
  const Y = d.getUTCFullYear(), M = pad2(d.getUTCMonth() + 1), D = pad2(d.getUTCDate());
  let out = '';
  if (hasDate) {
    if (/^d+[\/\-.]m+/.test(f)) out = `${D}/${M}/${Y}`;
    else if (/^y+/.test(f))     out = `${Y}-${M}-${D}`;
    else                        out = `${M}/${D}/${Y}`;
  }
  if (hasTime) {
    const t = `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}` + (/s/.test(f) ? `:${pad2(d.getUTCSeconds())}` : '');
    out = out ? `${out} ${t}` : t;
  }
  return out;
}

function cellText(cell){
  let v = cell.value;
  if (v && typeof v === 'object' && !(v instanceof Date)) {
    if ('result' in v) v = v.result;
    else if (v.richText) v = v.richText.map(t => t.text).join('');
    else if (v.text !== undefined) v = v.text;      // hyperlink
    else if (v.error) v = v.error;
  }
  if (v && typeof v === 'object' && !(v instanceof Date) && v.error) v = v.error;
  if (v == null) return '';
  if (v instanceof Date) return fmtDate(v, cell.numFmt);
  if (typeof v === 'number') return fmtNumber(v, cell.numFmt);
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  return String(v);
}

function mergeMap(ws){
  const masters = new Map(), covered = new Set();
  (ws.model.merges || []).forEach(rng => {
    const m = rng.match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/);
    if (!m) return;
    const c1 = colToNum(m[1]), r1 = +m[2], c2 = colToNum(m[3]), r2 = +m[4];
    masters.set(`${r1},${c1}`, { cs: c2 - c1 + 1, rs: r2 - r1 + 1 });
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++)
      if (r !== r1 || c !== c1) covered.add(`${r},${c}`);
  });
  return { masters, covered };
}

/* Optional Unicode font (needed for e.g. Vietnamese). Put TTFs in /fonts. */
async function tryLoadFont(doc){
  const toB64 = buf => { let s = ''; const a = new Uint8Array(buf);
    for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
    return btoa(s); };
  try {
    const [r, b] = await Promise.all([fetch('fonts/NotoSans-Regular.ttf'), fetch('fonts/NotoSans-Bold.ttf')]);
    if (!r.ok || !b.ok) return null;
    doc.addFileToVFS('NotoSans-Regular.ttf', toB64(await r.arrayBuffer()));
    doc.addFileToVFS('NotoSans-Bold.ttf', toB64(await b.arrayBuffer()));
    doc.addFont('NotoSans-Regular.ttf', 'NotoSans', 'normal');
    doc.addFont('NotoSans-Bold.ttf', 'NotoSans', 'bold');
    return 'NotoSans';
  } catch { return null; }
}

/* ------------------------------------------------------- PDF builder */
async function buildPdf(file){
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());

  const doc = new jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const customFont = await tryLoadFont(doc);
  const font = customFont || 'helvetica';
  const styleOf = (bold, italic) =>
    customFont ? (bold ? 'bold' : 'normal') : (bold && italic ? 'bolditalic' : bold ? 'bold' : italic ? 'italic' : 'normal');

  const margin = 24;
  const usable = doc.internal.pageSize.getWidth() - 2 * margin;
  let first = true;

  for (const ws of wb.worksheets) {
    if (!ws.rowCount || ws.state === 'hidden') continue;
    const nCols = Math.max(ws.columnCount, FIT_COLS);
    const { masters, covered } = mergeMap(ws);

    // ---- autofit A-H (measure real text widths), keep original widths elsewhere
    const widths = [];
    for (let c = 1; c <= nCols; c++) {
      if (c <= FIT_COLS) {
        let longest = 0;
        for (let r = 1; r <= ws.rowCount; r++) {
          if (covered.has(`${r},${c}`) || masters.has(`${r},${c}`)) continue;
          const cell = ws.getCell(r, c), txt = cellText(cell);
          if (!txt) continue;
          doc.setFont(font, styleOf(cell.font && cell.font.bold, false));
          doc.setFontSize(BASE_FONT);
          for (const line of txt.split(/\r?\n/)) longest = Math.max(longest, doc.getTextWidth(line));
        }
        widths.push(Math.min(Math.max(longest + 2 * PAD + 2, 28), MAX_COL_PT));
      } else {
        const ch = (ws.getColumn(c).width) || 8.43;
        widths.push(Math.max(ch * 5.2, 24));
      }
    }

    // ---- scaling: fit all columns on one page width
    const total = widths.reduce((a, b) => a + b, 0);
    const s = Math.min(1, usable / total);
    const fontSize = BASE_FONT * s;

    // ---- body
    const body = [];
    for (let r = 1; r <= ws.rowCount; r++) {
      if (ws.getRow(r).hidden) continue;
      const row = [];
      for (let c = 1; c <= nCols; c++) {
        if (covered.has(`${r},${c}`)) continue;
        const cell = ws.getCell(r, c);
        const txt = cellText(cell);
        const al = cell.alignment || {};
        const st = {};
        if (c <= FIT_COLS) { st.halign = 'center'; st.valign = 'middle'; }
        else {
          st.halign = ['left','right','center'].includes(al.horizontal) ? al.horizontal
                    : (typeof cell.value === 'number' ? 'right' : 'left');
          st.valign = al.vertical === 'top' ? 'top' : (al.vertical === 'middle' || al.vertical === 'center') ? 'middle' : 'bottom';
        }
        const f = cell.font || {};
        st.fontStyle = styleOf(f.bold, f.italic);
        const fc = f.color && argbToRgb(f.color.argb); if (fc) st.textColor = fc;
        const fl = cell.fill && cell.fill.type === 'pattern' && cell.fill.pattern === 'solid'
                   && argbToRgb(cell.fill.fgColor && cell.fill.fgColor.argb);
        if (fl) st.fillColor = fl;
        const obj = { content: txt, styles: st };
        const mg = masters.get(`${r},${c}`);
        if (mg) { obj.colSpan = mg.cs; obj.rowSpan = mg.rs; }
        row.push(obj);
      }
      body.push(row);
    }
    if (!body.length) continue;

    if (!first) doc.addPage();
    first = false;

    const columnStyles = {};
    widths.forEach((w, i) => { columnStyles[i] = { cellWidth: w * s }; });

    doc.autoTable({
      body,
      startY: margin,
      margin: { top: margin, bottom: margin, left: margin, right: margin },
      tableWidth: widths.reduce((a, w) => a + w * s, 0),
      theme: 'grid',
      styles: {
        font, fontSize, cellPadding: PAD * s, overflow: 'linebreak',
        lineColor: [190, 190, 190], lineWidth: 0.4 * s, textColor: [0, 0, 0],
        valign: 'bottom',
      },
      columnStyles,
    });
  }
  if (first) throw new Error('The workbook has no data to print.');
  return doc;
}

/* ---------------------------------------------------------- submit */
$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const msg = $('msg'), btn = $('btn');
  msg.className = 'msg'; msg.textContent = '';
  const f = fileInput.files[0];
  const s = $('start').value, e = $('end').value;
  try {
    if (!f) throw new Error('Please choose an Excel file.');
    if (!/\.(xlsx|xlsm)$/i.test(f.name)) throw new Error('Only .xlsx / .xlsm files are supported.');
    if (!$('reason').value.trim()) throw new Error('Please enter a Reason.');
    if (!s || !e) throw new Error('Please select a Period (start and end date).');
    if (s > e) throw new Error('The start date must be on or before the end date.');

    btn.disabled = true; btn.textContent = 'Generating…';
    const doc = await buildPdf(f);
    const name = buildName();
    doc.save(name);
    msg.className = 'msg ok'; msg.textContent = 'Done – downloaded ' + name;
  } catch (err) {
    console.error(err);
    msg.className = 'msg err'; msg.textContent = err.message || 'Something went wrong.';
  } finally {
    btn.disabled = false; btn.textContent = 'Generate PDF';
  }
});
</script>
</body>
</html>
